[general]
# import = ["./themes/themes/rose_pine.toml"]
import = ["./themes/themes/everforest_dark.toml"]
# [colors.primary]
# background = '#333333'

# Window Customization
[window]
opacity = 0.8
dimensions = { columns = 140, lines = 38 }
padding = { x = 0, y = 0 }
decorations = "None"
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

# Font Customization
[font]

# JetBrains
# normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
# bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
# italic = { family = "JetBrainsMono Nerd Font", style = "Medium" }

# normal = { family = "Ubuntu Nerd Font Nerd Font", style = "Medium" }
# bold = { family = "Ubuntu Nerd Font Nerd Font", style = "Bold" }
# italic = { family = "Ubuntu Nerd Font Nerd Font", style = "Medium" }

normal = { family = "Iosevka Medium Extended", style = "Medium" }
bold = { family = "Iosevka Extended", style = "Bold" }
italic = { family = "Iosevka Extended", style = "Medium" }

size = 10.5
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[env]
TERM = "xterm-256color"

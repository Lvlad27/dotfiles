[general]
import = ["./themes/themes/mellow.toml"]

# Window Customization
[window]
opacity = 0.8
dimensions = { columns = 140, lines = 38 }
padding = { x = 0, y = 0 }
decorations = "None"
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

# Font Customization
[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Regular" }
# normal = { family = "Iosevka", style = "Medium" }
# bold = { family = "Iosevka", style = "Bold" }
# italic = { family = "Iosevka", style = "Italic" }
size = 10
# size = 1
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[env]
TERM = "xterm-256color"

# Window Customization
[window]
opacity = 1
dimensions = { columns = 140, lines = 38 }
padding = { x = 0, y = 0 }
decorations = "None"
dynamic_title = true

[colors.primary]
background = "#1f1f28"
foreground = "#dcd7ba"

[colors.normal]
black = "#090618"
red = "#c34043"
green = "#76946a"
yellow = "#c0a36e"
blue = "#7e9cd8"
magenta = "#957fb8"
cyan = "#6a9589"
white = "#c8c093"

[colors.bright]
black = "#727169"
red = "#e82424"
green = "#98bb6c"
yellow = "#e6c384"
blue = "#7fb4ca"
magenta = "#938aa9"
cyan = "#7aa89f"
white = "#dcd7ba"

[colors.selection]
text = "#c8c093"
background = "#2d4f67"

[scrolling]
history = 10000
multiplier = 3

# Font Customization
[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
# normal = { family = "Iosevka", style = "Medium" }
# bold = { family = "Iosevka", style = "Bold" }
# italic = { family = "Iosevka", style = "Italic" }
size = 10
# size = 12
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[env]
TERM = "xterm-256color"

[general]
import = ["./themes/themes/gruvbox_material_medium_dark.toml"]

# Window Customization
[window]
# opacity = 0.8
dimensions = { columns = 140, lines = 38 }
padding = { x = 0, y = 0 }
decorations = "None"
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

# Font Customization
[font]
# JET BRAINS
# normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
# bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
# italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
#
# IOSEVKA
normal = { family = "Iosevka", style = "Medium Extended" }
bold = { family = "Iosevka", style = "Bold Extended" }
italic = { family = "Iosevka", style = "Medium Extended Italic" }
bold_italic = { family = "Iosevka", style = "Bold Extended Italic" }
#

size = 10.5
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[env]
TERM = "alacritty"

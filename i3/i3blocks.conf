separator=false
markup=pango

[calendar]
command=~/.config/i3/blocklets/calendar.sh
interval=1
min_width=800
LABEL= 
DATEFMT=+%a %d-%m-%Y %H:%M
# SHORTFMT=+%H:%M:%S
HEIGHT=180
WIDTH=220

[volume]
command=~/.config/i3/blocklets/volume.sh
interval=1
signal=1
#MIXER=[determined automatically]
SCONTROL=[determined automatically]
##exposed format variables: ${SYMB}, ${VOL}, ${INDEX}, ${NAME}
#LONG_FORMAT="${SYMB} ${VOL}% [${INDEX}:${NAME}]"
# SHORT_FORMAT="${SYMB} ${VOL}% [${INDEX}]"
#AUDIO_HIGH_SYMBOL='  '
#AUDIO_MED_THRESH=50
#AUDIO_MED_SYMBOL='  '
#AUDIO_LOW_THRESH=0
#AUDIO_LOW_SYMBOL='  '
#AUDIO_DELTA=5
#DEFAULT_COLOR="#ffffff"
#MUTED_COLOR="#a0a0a0"
#USE_ALSA_NAME=0
#USE_DESCRIPTION=0
## SUBSCRIBE=1 requires interval=persist and always uses LONG_FORMAT
#SUBSCRIBE=0


[kbdd_layout]
command=~/.config/i3/blocklets/kbdd_layout.sh
interval=persist
